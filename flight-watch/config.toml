# Rota e regras de busca. Tudo aqui é editável sem mexer no código.

[route]
origin = "GRU"
destination = "BER"
cabins = ["economy", "business"]

# Janela de busca: de hoje + min_days_ahead até hoje + max_days_ahead.
min_days_ahead = 14
max_days_ahead = 330

# Viagens de 15 dias.
# Ida: sexta a partir das 18h  -> volta no sábado (15 dias depois) a partir das 18h
#      sábado até 12h          -> volta no domingo (15 dias depois) até 12h
[[route.date_pattern]]
name = "sex-noite -> sab-noite"
outbound_weekday = 4        # 0=segunda ... 4=sexta
outbound_min_hour = 18
trip_days = 15
return_min_hour = 18

[[route.date_pattern]]
name = "sab-manha -> dom-manha"
outbound_weekday = 5        # sábado
outbound_max_hour = 12
trip_days = 15
return_max_hour = 12

[miles]
program = "LATAM Pass"
# R$ por 1.000 milhas. Referência de mercado em 2026: preço-alvo de compra
# ~R$ 25–26/milheiro (promoções de 62–65% OFF). Usado para converter
# resgates em reais e comparar com a tarifa em dinheiro.
value_per_thousand_brl = 25.0

# Rota e regras de busca. Tudo aqui é editável sem mexer no código.

[route]
origin = "GRU"
destination = "BER"
cabins = ["economy", "business"]

# Janela de busca: de hoje + min_days_ahead até hoje + max_days_ahead (~6 meses).
min_days_ahead = 0
max_days_ahead = 183

# Ida na sexta, qualquer horário -> volta no domingo duas semanas depois
# (16 dias), qualquer horário. Para limitar horário, use outbound_min_hour,
# outbound_max_hour, return_min_hour e return_max_hour.
[[route.date_pattern]]
name = "sex -> dom"
outbound_weekday = 4        # 0=segunda ... 4=sexta
trip_days = 16

[miles]
program = "LATAM Pass"
# R$ por 1.000 milhas. Referência de mercado em 2026: preço-alvo de compra
# ~R$ 25–26/milheiro (promoções de 62–65% OFF). Usado para converter
# resgates em reais e comparar com a tarifa em dinheiro.
value_per_thousand_brl = 25.0

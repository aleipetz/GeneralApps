# Rota e regras de busca. Tudo aqui é editável sem mexer no código.

[route]
origin = "GRU"
destination = "BER"
cabins = ["economy", "business"]

# Janela das datas de ida: de hoje + min_days_ahead até hoje + max_days_ahead (~6 meses).
min_days_ahead = 0
max_days_ahead = 183

# Ida na sexta (qualquer horário) e volta no domingo 16 dias depois (qualquer horário).
# Para restringir horários, use outbound_min_hour / outbound_max_hour /
# return_min_hour / return_max_hour (0–23).
[[route.date_pattern]]
name = "sex -> dom"
outbound_weekday = 4        # 0=segunda ... 4=sexta
trip_days = 16

[miles]
program = "LATAM Pass"
# R$ por 1.000 milhas. Referência de mercado em 2026: preço-alvo de compra
# ~R$ 25–26/milheiro (promoções de 62–65% OFF). Usado para converter
# resgates em reais e comparar com a tarifa em dinheiro.
value_per_thousand_brl = 25.0

[sweep]
# Pausa entre buscas no Google Flights (segundos, sorteada no intervalo).
pause_seconds = [2.0, 5.0]

[report]
# "digest": e-mail com tudo que foi coletado em cada varredura (+ CSV anexo),
#           marcando com ★ o que está abaixo da média.
# "alerts": e-mail só quando há oferta abaixo da média.
mode = "digest"

[alerts]
# Alerta quando o menor preço de uma data fica X% abaixo da média (mediana) de
# referência. A referência é a mesma cabine, com ida no mesmo mês (± season_months),
# observada nos últimos baseline_days dias.
pct_below_baseline = 0.20
baseline_days = 30
season_months = 1
min_baseline_samples = 8
# Depois de alertar uma data, só alerta de novo se o preço cair mais X%.
realert_drop = 0.05

# Preço que sempre merece alerta, mesmo sem histórico (R$, ida e volta).
[alerts.absolute_max_brl]
economy = 4500
business = 13000
